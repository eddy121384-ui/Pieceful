name: Puzzle Piece Depth Smoke

on:
  push:
    branches:
      - feat/issue-51-piece-depth
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-piece-depth-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN_DIR: "${{ github.workspace }}/.godot-ci"
  GODOT_BIN: "${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

jobs:
  depth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-godot-${{ runner.os }}-4.7.2-stable-web

      - name: Install Godot 4.7.2 and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GODOT_BIN_DIR}" "${GODOT_TEMPLATE_DIR}"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "${GODOT_BIN_DIR}"
          chmod +x "${GODOT_BIN}"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"             -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "${GODOT_TEMPLATE_DIR}/"

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit

      - name: Run depth smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_piece_depth_smoke.gd

      - name: Run depth benchmark
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_piece_depth_benchmark.gd

      - name: Run Rail visibility smoke
        shell: bash
        run: |
          set -euxo pipefail
          timeout 45s "${GODOT_BIN}" --headless --path . --script tests/rail_layout_visibility_smoke.gd

      - name: Run touch gesture arbitration smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/touch_gesture_arbitration_smoke.gd
