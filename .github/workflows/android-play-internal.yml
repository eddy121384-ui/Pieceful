name: Android Play Internal AAB

on:
  push:
    branches:
      - feat/issue-7-android-release-aab
  workflow_dispatch:
    inputs:
      version_code:
        description: "Monotonic Google Play version code"
        required: true
        default: "1"
      version_name:
        description: "User-visible version name"
        required: true
        default: "0.1.0-internal"

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN_DIR: "${{ github.workspace }}/.godot-ci"
  GODOT_BIN: "${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

jobs:
  validate-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor and templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-verified-toolchain-${{ runner.os }}-${{ hashFiles('release_toolchain.lock.json') }}

      - name: Verify and install locked Godot archives (including cache hits)
        run: python3 tools/release/install_godot.py --templates "${GODOT_TEMPLATE_DIR}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --version
          java -version
          test -d "${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/platform-tools/adb"

      - name: Install pinned monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/mobile/install_monetization_plugins.py
          test -f addons/AdmobPlugin/Admob.gd
          test -f addons/GMPShared/GmpLogger.gd
          test -f addons/GodotGooglePlayBilling/BillingClient.gd

      - name: Prepare CI release version
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/mobile/prepare_android_release.py \
            --version-code "${GITHUB_RUN_NUMBER}" \
            --version-name "0.1.0-ci.${GITHUB_RUN_NUMBER}"

      - name: Generate ephemeral CI upload key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -noprompt \
            -keystore /tmp/pieceful-ci-upload.jks \
            -storepass pieceful-ci-only \
            -keypass pieceful-ci-only \
            -alias pieceful_ci \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pieceful CI,O=Pieceful,C=TW"

      - name: Import project and plugins
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit
          python3 tools/release/install_android_components.py
          python3 tools/release/configure_android_sdk.py

      - name: Build CI-signed release AAB
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/pieceful-ci-upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: pieceful_ci
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: pieceful-ci-only
        run: |
          set -euxo pipefail
          mkdir -p build/android
          "${GODOT_BIN}" --headless --path . \
            --install-android-build-template \
            --export-release "Android Release AAB" build/android/piecepace-ci-release.aab
          test -s build/android/piecepace-ci-release.aab
          unzip -l build/android/piecepace-ci-release.aab | grep "base/lib/arm64-v8a/" >/dev/null
          jarsigner -verify build/android/piecepace-ci-release.aab

      - name: Upload CI AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piecepace-ci-aab-${{ github.sha }}
          path: build/android/piecepace-ci-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral CI key
        if: always()
        run: rm -f /tmp/pieceful-ci-upload.jks

  build-play-aab:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release-aab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}"
          ANDROID_UPLOAD_KEY_ALIAS: "${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}"
          ANDROID_UPLOAD_KEY_PASSWORD: "${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}"
        run: |
          set -euo pipefail
          test -n "${ANDROID_UPLOAD_KEYSTORE_BASE64}" || { echo "Missing ANDROID_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_UPLOAD_KEY_ALIAS}" || { echo "Missing ANDROID_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_UPLOAD_KEY_PASSWORD}" || { echo "Missing ANDROID_UPLOAD_KEY_PASSWORD"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Godot editor and templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-verified-toolchain-${{ runner.os }}-${{ hashFiles('release_toolchain.lock.json') }}

      - name: Verify and install locked Godot archives (including cache hits)
        run: python3 tools/release/install_godot.py --templates "${GODOT_TEMPLATE_DIR}"

      - name: Install pinned monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/mobile/install_monetization_plugins.py

      - name: Prepare Play release version
        shell: bash
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euxo pipefail
          python3 tools/mobile/prepare_android_release.py \
            --version-code "${RELEASE_VERSION_CODE}" \
            --version-name "${RELEASE_VERSION_NAME}"

      - name: Restore Android upload key
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}"
          ANDROID_UPLOAD_KEY_ALIAS: "${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}"
          ANDROID_UPLOAD_KEY_PASSWORD: "${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}"
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > /tmp/pieceful-upload.jks
          chmod 600 /tmp/pieceful-upload.jks
          keytool -list \
            -keystore /tmp/pieceful-upload.jks \
            -storepass:env ANDROID_UPLOAD_KEY_PASSWORD \
            -alias "${ANDROID_UPLOAD_KEY_ALIAS}" >/dev/null

      - name: Import project and plugins
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit
          python3 tools/release/install_android_components.py
          python3 tools/release/configure_android_sdk.py

      - name: Build Play-signed AAB
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/pieceful-upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: "${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}"
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: "${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}"
        run: |
          set -euo pipefail
          mkdir -p build/android
          "${GODOT_BIN}" --headless --path . \
            --install-android-build-template \
            --export-release "Android Release AAB" build/android/piecepace-play-release.aab
          test -s build/android/piecepace-play-release.aab
          jarsigner -verify build/android/piecepace-play-release.aab

      - name: Upload Play AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piecepace-play-aab-v${{ inputs.version_code }}
          path: build/android/piecepace-play-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary upload key
        if: always()
        run: rm -f /tmp/pieceful-upload.jks
