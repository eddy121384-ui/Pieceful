name: Curated Catalog Promotion

on:
  workflow_dispatch:
  push:
    branches:
      - feat/issue-9-content-ingestion-v0
    paths:
      - ".github/workflows/catalog-promotion.yml"
      - "tools/content_ingestion/promote_curated_catalog.py"
      - "content/curation/met_curator_sample_v0.json"
      - "content/curation/met_gold_set_v0.json"
      - "content/tag_taxonomy_v1.json"
      - "content/source_providers_v1.json"

permissions:
  contents: write

concurrency:
  group: pieceful-catalog-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify Python
        run: python --version

      - name: Compile promotion tool
        run: python -m py_compile tools/content_ingestion/promote_curated_catalog.py

      - name: Promotion self-test
        run: python tools/content_ingestion/promote_curated_catalog.py --self-test

      - name: Build 40-entry curated authoring catalog
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[promote-catalog]')
        run: python tools/content_ingestion/promote_curated_catalog.py

      - name: Upload curated catalog artifact
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[promote-catalog]')
        uses: actions/upload-artifact@v4
        with:
          name: met-curated-catalog-${{ github.run_id }}
          path: content/curation/met_curated_catalog_v0.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit curated catalog
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[promote-catalog]')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/curation/met_curated_catalog_v0.json
          if git diff --cached --quiet; then
            echo "Curated catalog unchanged."
            exit 0
          fi
          git commit -m "Generate 40-entry curated Met catalog [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
