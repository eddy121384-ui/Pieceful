# Pieceful Godot Web mobile preview. GitHub Pages is enabled in repository settings.
name: Godot Web Mobile Preview

on:
  push:
    branches:
      - infra/web-mobile-preview
      - main
      - feat/issue-6-completion-contract
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pieceful-pages
  cancel-in-progress: true

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN_DIR: "${{ github.workspace }}/.godot-ci"
  GODOT_BIN: "${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-godot-${{ runner.os }}-4.7.2-stable-web

      - name: Install Godot 4.7.2 and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GODOT_BIN_DIR}"
          mkdir -p "${GODOT_TEMPLATE_DIR}"

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "${GODOT_BIN_DIR}"
          chmod +x "${GODOT_BIN}"

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "${GODOT_TEMPLATE_DIR}/"

      - name: Verify Godot
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version
          test -f "${GODOT_TEMPLATE_DIR}/web_release.zip"

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit

      - name: Stable autosave smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/save_stable_snapshot_smoke.gd

      - name: Multi-slot save smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/multi_slot_save_smoke.gd

      - name: Save robustness smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/save_robustness_smoke.gd

      - name: Content identity save smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/content_identity_save_smoke.gd

      - name: Completion event contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/completion_event_contract_smoke.gd

      - name: Puzzle Journal store smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_journal_store_smoke.gd

      - name: Completion presentation smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/completion_presentation_smoke.gd

      - name: Puzzle Journal UI smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_journal_ui_smoke.gd

      - name: Puzzle selection flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_selection_flow_smoke.gd

      - name: Image-aware difficulty resolver smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/image_aware_difficulty_resolver_smoke.gd

      - name: Touch gesture arbitration smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/touch_gesture_arbitration_smoke.gd

      - name: Gallery flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/gallery_flow_smoke.gd

      - name: Gallery Retina portrait smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/gallery_retina_portrait_smoke.gd

      - name: Startup resume presentation smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/startup_resume_presentation_smoke.gd

      - name: Puzzle Me store smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_me_store_smoke.gd

      - name: Puzzle Me flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_me_flow_smoke.gd

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/web
          mkdir -p build/web
          "${GODOT_BIN}" --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          printf '{"ref":"%s","sha":"%s","run":"%s"}\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" \
            > build/web/build-info.json
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pieceful-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'pieceful-mobile-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
