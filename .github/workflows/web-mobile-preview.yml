# Pieceful Godot Web mobile preview. GitHub Pages is enabled in repository settings.
# Shared chess RC previews are published from main after feature preview runs finish.
name: Godot Web Mobile Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pieceful-pages
  cancel-in-progress: true

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN_DIR: "${{ github.workspace }}/.godot-ci"
  GODOT_BIN: "${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

jobs:
  build-web:
    # Feature previews have separate publishers; never replace the public root.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-godot-${{ runner.os }}-4.7.2-stable-web

      - name: Verify locked Godot archives and install templates (including cache hits)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/install_godot.py --templates "${GODOT_TEMPLATE_DIR}"
          python3 -m pip install -r tools/catalog_pipeline_requirements.txt

      - name: Verify Godot
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version
          test -f "${GODOT_TEMPLATE_DIR}/web_release.zip"

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit

      - name: Content taxonomy smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/content_taxonomy_smoke.gd

      - name: Analytics event contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/analytics_event_contract_smoke.gd

      - name: Analytics main integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/analytics_integration_smoke.gd

      - name: Stable autosave smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/save_stable_snapshot_smoke.gd

      - name: Multi-slot save smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/multi_slot_save_smoke.gd

      - name: Save robustness smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/save_robustness_smoke.gd

      - name: Content identity save smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/content_identity_save_smoke.gd

      - name: Completion event contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/completion_event_contract_smoke.gd

      - name: Puzzle Journal store smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_journal_store_smoke.gd

      - name: Completion presentation smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/completion_presentation_smoke.gd

      - name: Completion share card smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/completion_share_card_smoke.gd

      - name: Timelapse trace smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/timelapse_trace_smoke.gd

      - name: Timelapse replay smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/timelapse_replay_smoke.gd

      - name: Timelapse 9:16 video export smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/timelapse_video_export_smoke.gd

      - name: Puzzle Journal UI smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_journal_ui_smoke.gd

      - name: Commercial gameplay HUD smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/commercial_gameplay_hud_smoke.gd

      - name: Puzzle selection flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_selection_flow_smoke.gd

      - name: Image-aware difficulty resolver smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/image_aware_difficulty_resolver_smoke.gd

      - name: Touch gesture arbitration smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/touch_gesture_arbitration_smoke.gd

      - name: Piece pinch handoff smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/touch_piece_pinch_handoff_smoke.gd

      - name: Puzzle piece depth smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_piece_depth_smoke.gd

      - name: Puzzle piece overlap z-order smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_piece_overlap_z_order_smoke.gd

      - name: Gallery flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/gallery_flow_smoke.gd

      - name: Local recommendation smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/local_recommendation_smoke.gd

      - name: Monetization foundation smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/monetization_foundation_smoke.gd

      - name: Gallery Retina portrait smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/gallery_retina_portrait_smoke.gd

      - name: Startup resume presentation smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/startup_resume_presentation_smoke.gd

      - name: Puzzle Me store smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_me_store_smoke.gd

      - name: Puzzle Me flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/puzzle_me_flow_smoke.gd

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/web
          mkdir -p build/web
          python3 tools/release/export_web.py --godot "${GODOT_BIN}" --output build/web/index.html
          touch build/web/.nojekyll
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Instrument Godot loader throughput
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/instrument_web_loader.py build/web/index.html
          grep -q "Downloading Godot" build/web/index.html

      - name: Install browser smoke dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser runtime ready smoke
        shell: bash
        env:
          PIECEPACE_WEB_URL: http://127.0.0.1:4173/
        run: |
          set -euxo pipefail
          python3 -m http.server 4173 --directory build/web >/tmp/piecepace-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/index.html >/dev/null
          node tests/web_runtime_ready_smoke.mjs

      - name: Include Watercolor Chess preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/watercolor-chess
          cp web/previews/watercolor-chess/index.html build/web/watercolor-chess/index.html
          test -f build/web/watercolor-chess/index.html

      - name: Include Watercolor Chess save-resume isolated preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/watercolor-chess-save-resume
          cp web/previews/watercolor-chess-save-resume/index.html build/web/watercolor-chess-save-resume/index.html
          test -f build/web/watercolor-chess-save-resume/index.html

      - name: Include Ink Chess save-resume isolated preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/ink-chess-save-resume
          cp web/previews/ink-chess-save-resume/index.html build/web/ink-chess-save-resume/index.html
          test -f build/web/ink-chess-save-resume/index.html

      - name: Include Ink Chess round 2 preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/ink-chess-round2
          cp web/previews/ink-chess-round2/index.html build/web/ink-chess-round2/index.html
          test -f build/web/ink-chess-round2/index.html

      - name: Include Ink Chess Poki RC preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/ink-chess-poki-rc
          cp web/previews/ink-chess-poki-rc/index.html build/web/ink-chess-poki-rc/index.html
          test -f build/web/ink-chess-poki-rc/index.html

      - name: Include Watercolor Chess Poki RC preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/watercolor-chess-poki-rc
          cp web/previews/watercolor-chess-poki-rc/index.html build/web/watercolor-chess-poki-rc/index.html
          test -f build/web/watercolor-chess-poki-rc/index.html

      - name: Include Ukiyo-e Shogi preview
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/ukiyoe-shogi
          mkdir -p build/web/space-drift
          cp web/previews/ukiyoe-shogi/index.html build/web/ukiyoe-shogi/index.html
          test -f build/web/ukiyoe-shogi/index.html

      - name: Include Space Drift preview
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/space-drift
          cp web/previews/space-drift/index.html build/web/space-drift/index.html
          test -s build/web/space-drift/index.html

      - name: Include Space Drift Zero preview
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/space-drift-zero
          cp web/previews/space-drift-zero/index.html build/web/space-drift-zero/index.html
          cp web/previews/space-drift-zero/game.js build/web/space-drift-zero/game.js
          test -s build/web/space-drift-zero/index.html
          test -s build/web/space-drift-zero/game.js

      - name: Include Space Drift Zero LAB preview
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web/space-drift-zero-lab
          cp web/previews/space-drift-zero-lab/index.html build/web/space-drift-zero-lab/index.html
          cp web/previews/space-drift-zero-lab/game.js build/web/space-drift-zero-lab/game.js
          cp web/previews/space-drift-zero-lab/manifest.webmanifest build/web/space-drift-zero-lab/manifest.webmanifest
          test -s build/web/space-drift-zero-lab/index.html
          test -s build/web/space-drift-zero-lab/game.js
          test -s build/web/space-drift-zero-lab/manifest.webmanifest

      - name: Sync chess previews from main on feature-branch deploys
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          mkdir -p build/web/watercolor-chess
          mkdir -p build/web/watercolor-chess-save-resume
          mkdir -p build/web/ink-chess-round2
          mkdir -p build/web/ink-chess-save-resume
          mkdir -p build/web/ink-chess-poki-rc
          mkdir -p build/web/watercolor-chess-poki-rc
          mkdir -p build/web/ukiyoe-shogi
          mkdir -p build/web/space-drift-zero-lab
          git show origin/main:web/previews/watercolor-chess/index.html > build/web/watercolor-chess/index.html
          git show origin/main:web/previews/watercolor-chess-save-resume/index.html > build/web/watercolor-chess-save-resume/index.html
          git show origin/main:web/previews/ink-chess-round2/index.html > build/web/ink-chess-round2/index.html
          git show origin/main:web/previews/ink-chess-save-resume/index.html > build/web/ink-chess-save-resume/index.html
          git show origin/main:web/previews/ink-chess-poki-rc/index.html > build/web/ink-chess-poki-rc/index.html
          git show origin/main:web/previews/watercolor-chess-poki-rc/index.html > build/web/watercolor-chess-poki-rc/index.html
          git show origin/main:web/previews/ukiyoe-shogi/index.html > build/web/ukiyoe-shogi/index.html
          git show origin/main:web/previews/space-drift/index.html > build/web/space-drift/index.html
          git show origin/main:web/previews/space-drift-zero-lab/index.html > build/web/space-drift-zero-lab/index.html
          git show origin/main:web/previews/space-drift-zero-lab/game.js > build/web/space-drift-zero-lab/game.js
          test -s build/web/watercolor-chess/index.html
          test -s build/web/watercolor-chess-save-resume/index.html
          test -s build/web/ink-chess-round2/index.html
          test -s build/web/ink-chess-save-resume/index.html
          test -s build/web/ink-chess-poki-rc/index.html
          test -s build/web/watercolor-chess-poki-rc/index.html
          test -s build/web/ukiyoe-shogi/index.html
          test -s build/web/space-drift/index.html
          test -s build/web/space-drift-zero-lab/index.html
          test -s build/web/space-drift-zero-lab/game.js

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pieceful-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'pieceful-mobile-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Probe deployed Godot assets
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euxo pipefail
          BASE="${PAGE_URL%/}"
          echo "== response headers: index.wasm =="
          curl --fail --silent --show-error --location --head \
            -H 'Accept-Encoding: gzip, br' "${BASE}/index.wasm"
          echo "== response headers: index.pck =="
          curl --fail --silent --show-error --location --head \
            -H 'Accept-Encoding: gzip, br' "${BASE}/index.pck"
          echo "== transfer probe =="
          curl --fail --silent --show-error --location --compressed \
            -o /dev/null \
            -w 'wasm wire_bytes=%{size_download} speed_Bps=%{speed_download} total_s=%{time_total} type=%{content_type}\n' \
            "${BASE}/index.wasm"
          curl --fail --silent --show-error --location --compressed \
            -o /dev/null \
            -w 'pck wire_bytes=%{size_download} speed_Bps=%{speed_download} total_s=%{time_total} type=%{content_type}\n' \
            "${BASE}/index.pck"
