name: Puzzleability v0

# v0.1: authoring thumbnail resolution is non-blocking

on:
  workflow_dispatch:
  push:
    branches:
      - feat/issue-9-content-ingestion-v0
    paths:
      - ".github/workflows/puzzleability-v0.yml"
      - "tools/content_ingestion/analyze_puzzleability.py"
      - "content/curation/met_curated_catalog_v0.json"
      - "content/curation/met_puzzleability_review_v0.json"
      - "tools/content_ingestion/finalize_puzzleability.py"

permissions:
  contents: write

concurrency:
  group: pieceful-puzzleability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify Python
        run: python --version

      - name: Install image analysis dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy

      - name: Compile analyzer
        run: python -m py_compile tools/content_ingestion/analyze_puzzleability.py

      - name: Puzzleability self-test
        run: python tools/content_ingestion/analyze_puzzleability.py --self-test

      - name: Compile finalizer
        run: python -m py_compile tools/content_ingestion/finalize_puzzleability.py

      - name: Curator finalization self-test
        run: python tools/content_ingestion/finalize_puzzleability.py --self-test

      - name: Analyze 40 curated images
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[puzzleability]')
        run: python tools/content_ingestion/analyze_puzzleability.py

      - name: Apply curator Puzzleability review
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[puzzleability]')
        run: python tools/content_ingestion/finalize_puzzleability.py

      - name: Upload report artifact
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[puzzleability]')
        uses: actions/upload-artifact@v4
        with:
          name: pieceful-puzzleability-${{ github.run_id }}
          path: |
            content/curation/met_curated_catalog_v0.json
            content/curation/met_puzzleability_report_v0.json
            content/curation/met_runtime_candidates_v0.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit Puzzleability results
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[puzzleability]')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/curation/met_curated_catalog_v0.json content/curation/met_puzzleability_report_v0.json content/curation/met_runtime_candidates_v0.json
          if git diff --cached --quiet; then
            echo "Puzzleability results unchanged."
            exit 0
          fi
          git commit -m "Analyze Puzzleability for 40 curated Met images [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
