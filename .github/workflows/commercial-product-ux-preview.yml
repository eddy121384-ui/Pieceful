name: Commercial Product UX Branch Preview

on:
  push:
    branches: [spike/codex61-commercial-product-ux-pass]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Serialize with the existing Pages publisher so its public entry stays intact.
concurrency:
  group: pieceful-pages
  cancel-in-progress: false

env:
  GODOT_RELEASE: 4.7.2-stable
  GODOT_BIN: ${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64
  GODOT_TEMPLATE_DIR: /home/runner/.local/share/godot/export_templates/4.7.2.stable
  PREVIEW_PATH: previews/codex61-commercial-product-ux-pass

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-godot-${{ runner.os }}-4.7.2-stable-web
      - name: Install Godot and templates
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci "${GODOT_TEMPLATE_DIR}"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .godot-ci
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o /tmp/templates.tpz
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/SHA512-SUMS.txt" -o /tmp/godot-sums.txt
          python3 - <<'PY'
          import hashlib, os, pathlib
          sums = dict(line.split()[::-1] for line in pathlib.Path('/tmp/godot-sums.txt').read_text().splitlines() if line.strip())
          for local, suffix in [('godot.zip', 'linux.x86_64.zip'), ('templates.tpz', 'export_templates.tpz')]:
              artifact = f'Godot_v{os.environ["GODOT_RELEASE"]}_{suffix}'
              assert hashlib.sha512(pathlib.Path('/tmp', local).read_bytes()).hexdigest() == sums[artifact], artifact
          PY
          unzip -q /tmp/templates.tpz -d /tmp/watercolor-templates
          cp -R /tmp/watercolor-templates/templates/. "${GODOT_TEMPLATE_DIR}/"
      - name: Import and required gameplay regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --headless --path . --editor --quit
          printf '%s\n' commercial_product_navigation commercial_gameplay_hud watercolor_gameplay_system watercolor_reachable_ui rail_layout_visibility completion_presentation completion_share_card timelapse_replay timelapse_video_export touch_gesture_arbitration touch_piece_pinch_handoff puzzle_piece_depth puzzle_piece_overlap_z_order gallery_flow gallery_retina_portrait puzzle_selection_flow puzzle_journal_ui puzzle_me_flow multi_slot_save save_robustness content_identity_save startup_resume_presentation analytics_integration local_recommendation |
            xargs -P 2 -I '{}' bash -c '
              smoke="$1"
              mkdir -p "/tmp/pieceful-test-data/${smoke}"
              log="/tmp/pieceful-test-data/${smoke}.log"
              if ! XDG_DATA_HOME="/tmp/pieceful-test-data/${smoke}" timeout 180s "${GODOT_BIN}" --headless --path . --script "tests/${smoke}_smoke.gd" >"${log}" 2>&1; then
                cat "${log}"
                exit 1
              fi
              rg "^PASS" "${log}"
            ' _ '{}'
      - name: Web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          "${GODOT_BIN}" --headless --path . --export-release Web build/web/index.html
          python3 tools/instrument_web_loader.py build/web/index.html
          touch build/web/.nojekyll
          printf '{"ref":"%s","sha":"%s","run":"%s"}\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > build/web/build-info.json
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser runtime smoke
        shell: bash
        env:
          PIECEPACE_WEB_URL: http://127.0.0.1:4173/
          PIECEFUL_UX_QA_URL: http://127.0.0.1:4176/
          PIECEFUL_TEST_PHOTO: tests/fixtures/product-ux-photo.png
          PIECEFUL_UX_EVIDENCE: build/product-ux-evidence
        run: |
          set -euo pipefail
          python3 tools/export_product_ux_qa.py --godot "${GODOT_BIN}" >/tmp/product-ux-export.log 2>&1
          python3 -m http.server 4173 --directory build/web >/tmp/watercolor-web.log 2>&1 &
          SERVER_PID=$!
          python3 -m http.server 4176 --directory build/ux-qa >/tmp/product-ux-web.log 2>&1 &
          QA_SERVER_PID=$!
          trap 'kill "${SERVER_PID}" "${QA_SERVER_PID}" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/web_runtime_ready_smoke.mjs
          node tests/commercial_product_browser_flow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-product-ux-journeys-${{ github.sha }}
          path: build/product-ux-evidence
          if-no-files-found: ignore
      - name: Keep the current Pages deployment and add the isolated preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/publish
          # Start from the newest successful publisher's Pages artifact. Fail
          # closed if unavailable, instead of replacing unrelated public pages.
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=success&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/web-mobile-preview.yml" or .path == ".github/workflows/watercolor-ui-preview.yml" or .path == ".github/workflows/watercolor-ui-system-preview.yml" or .path == ".github/workflows/commercial-product-ux-preview.yml")][0].id')
          test "${RUN_ID}" != null
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)][0].id')
          test "${ARTIFACT_ID}" != null
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/current-pages.zip
          unzip -q /tmp/current-pages.zip -d /tmp/current-pages
          tar -xf /tmp/current-pages/artifact.tar -C build/publish
          test -s build/publish/index.html
          mkdir -p "build/publish/${PREVIEW_PATH}"
          cp -R build/web/. "build/publish/${PREVIEW_PATH}/"
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-product-ux-web-${{ github.sha }}
          path: build/web
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/publish
  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: pieceful-mobile-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/codex61-commercial-product-ux-pass/
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy isolated branch preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published branch and exact SHA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "${PAGE_URL%/}/${PREVIEW_PATH}/build-info.json?sha=${GITHUB_SHA}" -o /tmp/build-info.json
          python3 -c 'import json, os; data=json.load(open("/tmp/build-info.json")); assert data["sha"] == os.environ["GITHUB_SHA"]; assert data["ref"] == os.environ["GITHUB_REF_NAME"]; print(data)'
