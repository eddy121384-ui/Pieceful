name: Release Readiness Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_BIN: ${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64
  GODOT_TEMPLATE_DIR: /home/runner/.local/share/godot/export_templates/4.7.2.stable

jobs:
  web-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .godot-ci
          key: pieceful-verified-toolchain-${{ runner.os }}-${{ hashFiles('release_toolchain.lock.json') }}
      - name: Verify and install locked editor/templates (including cache hits)
        run: python3 tools/release/install_godot.py
      - name: Offline catalog tooling and authoritative-input validation
        run: |
          python3 -m pip install -r tools/catalog_pipeline_requirements.txt
          python3 tools/catalog_pipeline.py validate --report build/catalog-pipeline/validation.json
      - name: Import accepted production project
        run: '"${GODOT_BIN}" --headless --path . --editor --quit'
      - name: Repository, content and release configuration regressions
        run: |
          python3 tests/release_readiness_smoke.py
          python3 tests/content_ingestion_smoke.py
          python3 tests/catalog_packaging_smoke.py
          python3 tools/release/check_repository.py
      - name: All accepted native regressions and release provider guard
        run: |
          python3 tools/release/run_native_regressions.py
          "${GODOT_BIN}" --headless --path . --script tests/catalog_texture_lifecycle_smoke.gd
      - name: Production Web export and package inspection
        run: python3 tools/release/export_web.py
      - name: Isolated end-to-end catalog sample (never shipping)
        run: python3 tools/catalog_pipeline.py demo --output build/catalog-pipeline-demo --godot "${GODOT_BIN}"
      - name: Same-input resource reproducibility and loader idempotency (report container bytes)
        run: |
          python3 tools/release/export_web.py --output build/release-web-repeat/index.html
          python3 tools/release/compare_web_exports.py build/release-web build/release-web-repeat
      - name: Separate non-shipping browser fixture
        run: python3 tools/export_product_ux_qa.py --godot "${GODOT_BIN}"
      - name: Browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Production startup/failure checks and accepted browser journeys
        env:
          PIECEPACE_WEB_URL: http://127.0.0.1:4290/
          PIECEFUL_UX_QA_URL: http://127.0.0.1:4291/
          PIECEFUL_TEST_PHOTO: tests/fixtures/product-ux-photo.png
          PIECEFUL_UX_EVIDENCE: build/release-browser-tests/ux
          PIECEFUL_TRANSITION_EVIDENCE: build/release-browser-tests/transitions
          PIECEFUL_RELEASE_EVIDENCE: build/release-browser-tests/production
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4290 --directory build/release-web > /tmp/release-web.log 2>&1 &
          PROD_PID=$!
          python3 -m http.server 4291 --directory build/ux-qa > /tmp/release-qa.log 2>&1 &
          QA_PID=$!
          trap 'kill "${PROD_PID}" "${QA_PID}" || true' EXIT
          node tests/web_runtime_ready_smoke.mjs
          node tests/release_web_browser_smoke.mjs
          node tests/commercial_product_browser_flow.mjs
          node tests/rail_scatter_transition_browser_smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-readiness-web-${{ github.sha }}
          path: |
            build/release-web/
            build/release-native-tests/*.log
            build/release-native-tests/results.json
            build/release-browser-tests/
          if-no-files-found: warn
          retention-days: 14

  android-unsigned-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .godot-ci
          key: pieceful-verified-toolchain-${{ runner.os }}-${{ hashFiles('release_toolchain.lock.json') }}
      - name: Verify and install locked editor/templates
        run: |
          python3 tools/release/install_godot.py
          python3 tools/release/install_bundletool.py
      - name: Install Android SDK components and configure local editor paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/install_android_components.py
          "${GODOT_BIN}" --headless --path . --editor --quit
          python3 tools/release/configure_android_sdk.py
      - name: Offline catalog tooling and authoritative-input validation
        run: |
          python3 -m pip install -r tools/catalog_pipeline_requirements.txt
          python3 tools/catalog_pipeline.py validate
      - name: Base-game unsigned release APK and AAB (no keys or monetization SDKs)
        run: python3 tools/release/export_android_validation.py --templates "${GODOT_TEMPLATE_DIR}"
      - name: Inspect release manifest, asset boundaries, sources, notices and 16 KB alignment
        run: |
          python3 tools/release/inspect_android.py build/android-validation/pieceful-validation-unsigned.apk build/android-validation/pieceful-validation-unsigned.aab > build/android-validation/artifact-manifest.json
          cat build/android-validation/artifact-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: release-readiness-UNSIGNED-android-${{ github.sha }}
          path: build/android-validation/
          if-no-files-found: error
          retention-days: 7
