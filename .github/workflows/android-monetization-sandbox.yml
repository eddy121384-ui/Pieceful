name: Android Monetization Sandbox

on:
  push:
    branches:
      - feat/issue-7-android-release-aab
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN_DIR: "${{ github.workspace }}/.godot-ci"
  GODOT_BIN: "${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor and templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: pieceful-verified-toolchain-${{ runner.os }}-${{ hashFiles('release_toolchain.lock.json') }}

      - name: Verify and install locked Godot archives (including cache hits)
        run: python3 tools/release/install_godot.py --templates "${GODOT_TEMPLATE_DIR}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          test -n "${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/platform-tools/adb"
          "${ANDROID_HOME}/platform-tools/adb" version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "JAVA_HOME=${JAVA_HOME}"

      - name: Install pinned monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/mobile/install_monetization_plugins.py
          test -f addons/AdmobPlugin/Admob.gd
          test -f addons/GodotGooglePlayBilling/BillingClient.gd

      - name: Import project and plugins
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit
          sdkmanager "platforms;android-36" "build-tools;36.1.0"
          python3 tools/release/configure_android_sdk.py

      - name: Export Android debug APK with Gradle template
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          # Godot 4.7 documents --install-android-build-template as an export
          # companion flag; combining both operations avoids editor-mode no-op.
          "${GODOT_BIN}" --headless --path .             --install-android-build-template             --export-debug "Android Debug" build/android/piecepace-debug.apk
          test -d android/build
          test -s build/android/piecepace-debug.apk
          find android/build -maxdepth 2 -type f | head -40
          unzip -l build/android/piecepace-debug.apk | grep -E "lib/arm64-v8a|GodotGooglePlayBilling|admob" >/dev/null

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piecepace-android-monetization-${{ github.sha }}
          path: build/android/piecepace-debug.apk
          if-no-files-found: error
          retention-days: 14
