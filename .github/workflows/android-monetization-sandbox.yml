name: Android Monetization Sandbox

on:
  push:
    branches:
      - feat/issue-7-native-mobile-monetization
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN_DIR: "${{ github.workspace }}/.godot-ci"
  GODOT_BIN: "${{ github.workspace }}/.godot-ci/Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "/home/runner/.local/share/godot/export_templates/4.7.2.stable"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GODOT_BIN_DIR}" "${GODOT_TEMPLATE_DIR}"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "${GODOT_BIN_DIR}"
          chmod +x "${GODOT_BIN}"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"             -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "${GODOT_TEMPLATE_DIR}/"
          "${GODOT_BIN}" --version
          test -f "${GODOT_TEMPLATE_DIR}/android_source.zip"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          test -n "${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/platform-tools/adb"
          "${ANDROID_HOME}/platform-tools/adb" version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "JAVA_HOME=${JAVA_HOME}"

      - name: Install pinned monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/mobile/install_monetization_plugins.py
          test -f addons/AdmobPlugin/Admob.gd
          test -f addons/GodotGooglePlayBilling/BillingClient.gd

      - name: Import project and plugins
        shell: bash
        run: |
          set -euxo pipefail
          "${GODOT_BIN}" --headless --path . --editor --quit

      - name: Export Android debug APK with Gradle template
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          # Godot 4.7 documents --install-android-build-template as an export
          # companion flag; combining both operations avoids editor-mode no-op.
          "${GODOT_BIN}" --headless --path .             --install-android-build-template             --export-debug "Android Debug" build/android/piecepace-debug.apk
          test -d android/build
          test -s build/android/piecepace-debug.apk
          find android/build -maxdepth 2 -type f | head -40
          unzip -l build/android/piecepace-debug.apk | grep -E "lib/arm64-v8a|GodotGooglePlayBilling|admob" >/dev/null

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: piecepace-android-monetization-${{ github.sha }}
          path: build/android/piecepace-debug.apk
          if-no-files-found: error
          retention-days: 14
