<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 4x4 atlas, 64px cells. Each icon uses a 24x24 source grid scaled 2x. -->
  <g transform="translate(8 8) scale(2)">
    <!-- tray -->
    <path d="M3 7h18l-2 11H5L3 7Z"/><path d="M7 11h10"/><path d="M9 7V5h6v2"/>
  </g>
  <g transform="translate(72 8) scale(2)">
    <!-- add -->
    <path d="M12 5v14M5 12h14"/>
  </g>
  <g transform="translate(136 8) scale(2)">
    <!-- back -->
    <path d="m14 6-6 6 6 6"/><path d="M8 12h10"/>
  </g>
  <g transform="translate(200 8) scale(2)">
    <!-- rename / pencil -->
    <path d="m4 16 1 4 4-1 9-9-4-4-9 9Z"/><path d="m13 7 4 4"/>
  </g>

  <g transform="translate(8 72) scale(2)">
    <!-- grip -->
    <circle cx="8" cy="7" r="1" fill="#F4F7FB" stroke="none"/><circle cx="16" cy="7" r="1" fill="#F4F7FB" stroke="none"/>
    <circle cx="8" cy="12" r="1" fill="#F4F7FB" stroke="none"/><circle cx="16" cy="12" r="1" fill="#F4F7FB" stroke="none"/>
    <circle cx="8" cy="17" r="1" fill="#F4F7FB" stroke="none"/><circle cx="16" cy="17" r="1" fill="#F4F7FB" stroke="none"/>
  </g>
  <g transform="translate(72 72) scale(2)">
    <!-- zoom out -->
    <circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/><path d="M7 10h6"/>
  </g>
  <g transform="translate(136 72) scale(2)">
    <!-- zoom in -->
    <circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/><path d="M7 10h6M10 7v6"/>
  </g>
  <g transform="translate(200 72) scale(2)">
    <!-- fit -->
    <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
  </g>

  <g transform="translate(8 136) scale(2)">
    <!-- reshuffle -->
    <path d="M4 7h3c4 0 4 10 8 10h5"/><path d="m17 14 3 3-3 3"/><path d="M4 17h3c2 0 3-2 4-4"/><path d="M13 9c1-1 2-2 4-2h3"/><path d="m17 4 3 3-3 3"/>
  </g>
  <g transform="translate(72 136) scale(2)">
    <!-- preview off -->
    <path d="M3 12s3-5 9-5 9 5 9 5-3 5-9 5-9-5-9-5Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/>
  </g>
  <g transform="translate(136 136) scale(2)">
    <!-- preview floating -->
    <path d="M3 11s3-5 9-5 9 5 9 5-3 5-9 5-9-5-9-5Z"/><circle cx="12" cy="11" r="2.5"/><rect x="15.5" y="15.5" width="5" height="4.5" rx="1"/>
  </g>
  <g transform="translate(200 136) scale(2)">
    <!-- preview board -->
    <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M6.5 12s2-3.5 5.5-3.5 5.5 3.5 5.5 3.5-2 3.5-5.5 3.5S6.5 12 6.5 12Z"/><circle cx="12" cy="12" r="1.8"/>
  </g>

  <g transform="translate(8 200) scale(2)">
    <!-- hint -->
    <path d="M8.5 15.5C7 14.3 6 12.4 6 10.2A6 6 0 0 1 18 10.2c0 2.2-1 4.1-2.5 5.3-.8.7-1.1 1.2-1.2 2H9.7c-.1-.8-.4-1.3-1.2-2Z"/><path d="M9.5 21h5M10 18h4"/>
  </g>
  <g transform="translate(72 200) scale(2)">
    <!-- grid / board lines -->
    <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/>
  </g>
  <g transform="translate(136 200) scale(2)">
    <!-- replay -->
    <path d="M7 7H3v-4"/><path d="M4 7a8 8 0 1 1-1 8"/>
  </g>
  <g transform="translate(200 200) scale(2)">
    <!-- close -->
    <path d="M6 6l12 12M18 6 6 18"/>
  </g>
</svg>
