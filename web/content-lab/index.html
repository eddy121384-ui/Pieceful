</style></head><body><main class="wrap">

ions","high_contrast"],"sty":["painting","oil_painting"],"scene":["still_life"],"conf":0.96,"rev":false},{"id":"met_54333","q":"still life","fit":"match","cat":"objects","sub":["still_life","furniture","boxes","decorative_objects"],"reg":["japan"],"mood":["contemplative","nostalgic"],"vis":["muted","negative_space","detailed","clear_regions"],"sty":["print"],"scene":["still_life"],"conf":0.94,"rev":false},{"id":"met_54988","q":"flowers","fit":"match","cat":"nature","sub":["flowers","cherry_blossoms"],"reg":["japan"],"mood":["calm","contemplative"],"vis":["clear_regions","negative_space","muted"],"sty":["print"],"scene":["still_life"],"conf":0.95,"rev":false}];
const CLOUD_URL="https://raw.githubusercontent.com/eddy121384-ui/Pieceful/feat/issue-9-content-ingestion-v0/web/content-lab/data/latest.json";
const K="pieceful_content_lab_ai_curator_v1";
let D=BASELINE,state=JSON.parse(localStorage.getItem(K)||"{}"),filter="pending",idx=0,meta={},cloudMode=false,runInfo=null;
const $=x=>document.getElementById(x);const arr=v=>Array.isArray(v)?v:[];
function save(){localStorage.setItem(K,JSON.stringify(state))}
function reviewed(e){return state[e.id]?.decision}
function list(){return D.filter(e=>filter==="all"||filter==="pending"&&(cloudMode?e.rev&&!reviewed(e):!reviewed(e))||filter==="auto"&&cloudMode&&!e.rev||filter==="reviewed"&&reviewed(e))}
function tags(v){return arr(v).map(x=>'<span class="tag">'+x+'</span>').join("")||'<span class="muted">—</span>'}
function cloudEntry(e){
 const t=e.taxonomy||{},c=e.confidence||{};
 return {id:e.id,q:e.ingestion_query||"",fit:e.provenance?.escalated?"AI 二審":"AI 初審",cat:t.category||"error",sub:t.subject||[],reg:t.region_culture||[],mood:t.mood||[],vis:t.visual||[],sty:t.style||[],scene:t.scene||[],conf:Number(c.overall||0),rev:!!e.human_review_required,title:e.title||e.id,creator:e.creator||e.culture||"",image_url:e.image_url||"",source_url:e.source_url||"",reasons:e.review_reasons||[],error:e.error||"",provenance:e.provenance||{}}
}
async function loadCloud(){
 try{
   const r=await fetch(CLOUD_URL+"?t="+Date.now(),{cache:"no-store"});
   if(!r.ok)throw new Error("HTTP "+r.status);
   const j=await r.json();
   if(j.kind!=="pieceful_ai_curator_run"||!Array.isArray(j.entries)||!j.entries.length)throw new Error("no curator entries");
   D=j.entries.map(cloudEntry);runInfo=j;cloudMode=true;
   const s=j.summary||{};
   document.querySelector(".muted").textContent="AI Curator · "+(s.auto_approved||0)+" 自動通過 / "+(s.human_review_required||0)+" 待人審";
 }catch(err){
   cloudMode=false;runInfo=null;D=BASELINE;
   document.querySelector(".muted").textContent="Baseline preview · 尚無雲端 AI Curator 結果";
 }
}
async function getMeta(e){
 if(e.image_url||e.title){return {title:e.title||e.id,artistDisplayName:e.creator||"",primaryImageSmall:e.image_url||"",objectURL:e.source_url||""}}
 if(meta[e.id])return meta[e.id];
 const id=e.id.split("_")[1],r=await fetch("https://collectionapi.metmuseum.org/public/collection/v1/objects/"+id);
 if(!r.ok)throw new Error("Met API "+r.status);return meta[e.id]=await r.json()
}
function effective(e){return Object.assign({},e,state[e.id]?.tags||{})}
async function render(){
 const L=list(),done=Object.keys(state).filter(k=>state[k]?.decision).length,total=cloudMode?D.filter(e=>e.rev).length:40;
 $("prog").textContent=done+" / "+total;
 if(!L.length){$("card").classList.add("hide");$("empty").classList.remove("hide");$("empty").textContent=cloudMode&&filter==="pending"?"🎉 AI 已處理完，目前沒有需要你人工判斷的圖片。":"這個篩選沒有圖片了。";return}
 $("card").classList.remove("hide");$("empty").classList.add("hide");if(idx>=L.length)idx=0;
 const e=L[idx],v=effective(e);
 $("num").textContent=(idx+1)+" / "+L.length;
 $("conf").textContent=e.conf?Math.round(e.conf*100)+"%":"—";
 $("query").textContent=e.q?"query: "+e.q:"";
 $("fit").textContent=e.fit||"";
 $("iid").textContent=e.id;
 $("warn").classList.toggle("hide",!e.rev);
 $("warn").textContent=e.error?"AI Curator 執行失敗："+e.error:(e.reasons?.length?"需要人工確認："+e.reasons.join(" · "):"AI 二輪審核後仍建議人工確認");
 $("rows").innerHTML=[["category",[v.cat]],["subject",v.sub],["region",v.reg],["mood",v.mood],["visual",v.vis],["style",v.sty],["scene",v.scene]].map(r=>'<div class="row"><div class="lab">'+r[0]+'</div><div class="tags">'+tags(r[1])+'</div></div>').join("");
 $("note").value=state[e.id]?.note||"";$("img").src="";$("title").textContent="載入中…";$("creator").textContent="";
 try{const mm=await getMeta(e);$("title").textContent=mm.title||e.id;$("creator").textContent=mm.artistDisplayName||"";$("img").src=mm.primaryImageSmall||mm.primaryImage||"";$("sourceBtn").onclick=()=>window.open(mm.objectURL||("https://www.metmuseum.org/art/collection/search/"+e.id.split("_")[1]),"_blank")}
 catch(err){$("title").textContent=e.title||e.id;$("creator").textContent="圖片載入失敗："+err.message}
}
function cur(){const L=list();return L[idx]}
function decide(d){const e=cur();if(!e)return;state[e.id]=state[e.id]||{};state[e.id].decision=d;state[e.id].note=$("note").value;save();idx=Math.min(idx,list().length-1);render()}
$("accept").onclick=()=>decide("accept");$("review").onclick=()=>decide("needs_review");$("next").onclick=()=>{idx++;render()};$("prev").onclick=()=>{idx=Math.max(0,idx-1);render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.f;idx=0;render()});
$("note").oninput=()=>{const e=cur();if(!e)return;state[e.id]=state[e.id]||{};state[e.id].note=$("note").value;save()};
$("editBtn").onclick=()=>{const e=cur();if(!e)return;const v=effective(e),ed=$("edit");ed.classList.toggle("open");if(!ed.classList.contains("open"))return;ed.innerHTML='<div class="field"><label>category</label><select id="ec">'+["nature","animals","places","art_culture","food","objects","people","abstract"].map(x=>'<option '+(x===v.cat?"selected":"")+'>'+x+'</option>').join("")+'</select></div>'+[["sub","subject"],["reg","region"],["mood","mood"],["vis","visual"],["sty","style"],["scene","scene"]].map(x=>'<div class="field"><label>'+x[1]+'（逗號分隔）</label><input id="e'+x[0]+'" value="'+arr(v[x[0]]).join(", ")+'"></div>').join("")+'<button id="saveEdit" class="tool">儲存修改</button>';$("saveEdit").onclick=()=>{state[e.id]=state[e.id]||{};state[e.id].tags={cat:$("ec").value,sub:$("esub").value.split(",").map(s=>s.trim()).filter(Boolean),reg:$("ereg").value.split(",").map(s=>s.trim()).filter(Boolean),mood:$("emood").value.split(",").map(s=>s.trim()).filter(Boolean),vis:$("evis").value.split(",").map(s=>s.trim()).filter(Boolean),sty:$("esty").value.split(",").map(s=>s.trim()).filter(Boolean),scene:$("escene").value.split(",").map(s=>s.trim()).filter(Boolean)};save();ed.classList.remove("open");render()}};
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({schema_version:1,kind:"pieceful_mobile_ai_curator_review",curator_run:runInfo?.generated_at||null,exported_at:new Date().toISOString(),reviews:state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pieceful_ai_curator_review.json";a.click();URL.revokeObjectURL(a.href)};
(async()=>{await loadCloud();render()})();
</script></body></html>
