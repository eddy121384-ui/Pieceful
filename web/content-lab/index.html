const K="pieceful_content_lab_v1";let state=JSON.parse(localStorage.getItem(K)||"{}"),filter="pending",idx=0,meta={};
const $=x=>document.getElementById(x);const arr=v=>Array.isArray(v)?v:[];
function save(){localStorage.setItem(K,JSON.stringify(state))}
function reviewed(e){return state[e.id]?.decision}
function list(){return D.filter(e=>filter==="all"||filter==="pending"&&!reviewed(e)||filter==="reviewed"&&reviewed(e)||filter==="flagged"&&e.rev)}
function tags(v){return arr(v).map(x=>'<span class="tag">'+x+'</span>').join("")||'<span class="muted">—</span>'}
async function getMeta(e){if(meta[e.id])return meta[e.id];const id=e.id.split("_")[1];const r=await fetch("https://collectionapi.metmuseum.org/public/collection/v1/objects/"+id);if(!r.ok)throw new Error("Met API "+r.status);return meta[e.id]=await r.json()}
function effective(e){return Object.assign({},e,state[e.id]?.tags||{})}
async function render(){
 const L=list();$("prog").textContent=Object.keys(state).filter(k=>state[k]?.decision).length+" / 40";
 if(!L.length){$("card").classList.add("hide");$("empty").classList.remove("hide");return}$("card").classList.remove("hide");$("empty").classList.add("hide");if(idx>=L.length)idx=0;
 const e=L[idx],v=effective(e);$("num").textContent=(idx+1)+" / "+L.length;$("conf").textContent=Math.round(e.conf*100)+"%";$("query").textContent="query: "+e.q;$("fit").textContent=e.fit;$("iid").textContent=e.id;$("warn").classList.toggle("hide",!e.rev);
 $("rows").innerHTML=[["category",[v.cat]],["subject",v.sub],["region",v.reg],["mood",v.mood],["visual",v.vis],["style",v.sty],["scene",v.scene]].map(r=>'<div class="row"><div class="lab">'+r[0]+'</div><div class="tags">'+tags(r[1])+'</div></div>').join("");
 $("note").value=state[e.id]?.note||"";$("img").src="";$("title").textContent="載入中…";$("creator").textContent="";
 try{const m=await getMeta(e);$("title").textContent=m.title||e.id;$("creator").textContent=m.artistDisplayName||m.culture||"";$("img").src=m.primaryImageSmall||m.primaryImage||"";$("sourceBtn").onclick=()=>window.open(m.objectURL||("https://www.metmuseum.org/art/collection/search/"+e.id.split("_")[1]),"_blank")}
 catch(err){$("title").textContent=e.id;$("creator").textContent="圖片載入失敗："+err.message}
}
function cur(){const L=list();return L[idx]}
function decide(d){const e=cur();if(!e)return;state[e.id]=state[e.id]||{};state[e.id].decision=d;state[e.id].note=$("note").value;save();idx=Math.min(idx,list().length-1);render()}
$("accept").onclick=()=>decide("accept");$("review").onclick=()=>decide("needs_review");$("next").onclick=()=>{idx++;render()};$("prev").onclick=()=>{idx=Math.max(0,idx-1);render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.f;idx=0;render()});
$("note").oninput=()=>{const e=cur();if(!e)return;state[e.id]=state[e.id]||{};state[e.id].note=$("note").value;save()};
$("editBtn").onclick=()=>{const e=cur();if(!e)return;const v=effective(e),ed=$("edit");ed.classList.toggle("open");if(!ed.classList.contains("open"))return;ed.innerHTML='<div class="field"><label>category</label><select id="ec">'+["nature","animals","places","art_culture","food","objects","people","abstract"].map(x=>'<option '+(x===v.cat?"selected":"")+'>'+x+'</option>').join("")+'</select></div>'+[["sub","subject"],["reg","region"],["mood","mood"],["vis","visual"],["sty","style"],["scene","scene"]].map(x=>'<div class="field"><label>'+x[1]+'（逗號分隔）</label><input id="e'+x[0]+'" value="'+arr(v[x[0]]).join(", ")+'"></div>').join("")+'<button id="saveEdit" class="tool">儲存修改</button>';$("saveEdit").onclick=()=>{state[e.id]=state[e.id]||{};state[e.id].tags={cat:$("ec").value,sub:$("esub").value.split(",").map(s=>s.trim()).filter(Boolean),reg:$("ereg").value.split(",").map(s=>s.trim()).filter(Boolean),mood:$("emood").value.split(",").map(s=>s.trim()).filter(Boolean),vis:$("evis").value.split(",").map(s=>s.trim()).filter(Boolean),sty:$("esty").value.split(",").map(s=>s.trim()).filter(Boolean),scene:$("escene").value.split(",").map(s=>s.trim()).filter(Boolean)};save();ed.classList.remove("open");render()}};

render();
